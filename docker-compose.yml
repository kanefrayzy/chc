name: chcgreen

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_TTL_SEC: ${JWT_ACCESS_TTL_SEC}
  JWT_REFRESH_TTL_SEC: ${JWT_REFRESH_TTL_SEC}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN}
  COOKIE_SECURE: ${COOKIE_SECURE}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_REGION: ${S3_REGION}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
  SITE_NAME: ${SITE_NAME}
  API_PUBLIC_URL: ${API_PUBLIC_URL}
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
  ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL}
  REALTIME_PUBLIC_URL: ${REALTIME_PUBLIC_URL}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chcgreen]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chcgreen]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [chcgreen]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: ${API_PORT:-4000}
      BETRA_H2H_API_URL: ${BETRA_H2H_API_URL}
      BETRA_H2H_API_KEY: ${BETRA_H2H_API_KEY}
      BETRA_H2H_WEBHOOK_SECRET: ${BETRA_H2H_WEBHOOK_SECRET}
      WESTWALLET_API_URL: ${WESTWALLET_API_URL}
      WESTWALLET_PUBLIC_KEY: ${WESTWALLET_PUBLIC_KEY}
      WESTWALLET_PRIVATE_KEY: ${WESTWALLET_PRIVATE_KEY}
      WESTWALLET_WEBHOOK_PUBLIC_KEY: ${WESTWALLET_WEBHOOK_PUBLIC_KEY}
      DEPOSIT_MIN_MINOR: ${DEPOSIT_MIN_MINOR}
      DEPOSIT_MAX_MINOR: ${DEPOSIT_MAX_MINOR}
      WITHDRAW_MIN_MINOR: ${WITHDRAW_MIN_MINOR}
      WITHDRAW_MAX_MINOR: ${WITHDRAW_MAX_MINOR}
      WITHDRAW_DAILY_MAX_MINOR: ${WITHDRAW_DAILY_MAX_MINOR}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [chcgreen]

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: ${REALTIME_PORT:-4001}
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }
    ports:
      - "${REALTIME_PORT:-4001}:4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [chcgreen]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3000}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api: { condition: service_started }
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [chcgreen]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${ADMIN_PORT:-3001}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
    depends_on:
      api: { condition: service_started }
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    networks: [chcgreen]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  chcgreen:
    driver: bridge
